<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SanalOda – Arkadaşlarınla Buluş</title>
  <meta name="description" content="Arkadaşlarınla sanal ortamda buluş, yemek sipariş et, müzik dinle ve eğlenceli vakit geçir!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #7c3aed;
      --primary-light: #a78bfa;
      --secondary: #ec4899;
      --accent: #f59e0b;
      --bg: #0a0a1a;
      --surface: rgba(255,255,255,0.05);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.1);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --glow: 0 0 40px rgba(124,58,237,0.3);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width: 600px; height: 600px; background: var(--primary); top: -200px; left: -200px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: var(--secondary); bottom: -100px; right: -100px; animation-delay: -3s; }
    .orb-3 { width: 300px; height: 300px; background: var(--accent); top: 50%; left: 50%; animation-delay: -6s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* Particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: particle-float linear infinite;
    }

    @keyframes particle-float {
      0% { opacity: 0; transform: translateY(100vh) scale(0); }
      10% { opacity: 0.6; }
      90% { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-100px) scale(1); }
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 48px;
    }
    .logo-icon {
      font-size: 4rem;
      display: block;
      margin-bottom: 12px;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .logo h1 {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(135deg, #a78bfa, #ec4899, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }
    .logo p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 8px;
    }

    /* Card */
    .card {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5), var(--glow);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(124,58,237,0.4);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Form elements */
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary-light);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.2); }

    /* Avatar picker */
    .avatar-picker {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }
    .avatar-option {
      font-size: 1.5rem;
      width: 48px;
      height: 48px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .avatar-option:hover { background: rgba(255,255,255,0.1); transform: scale(1.1); }
    .avatar-option.selected {
      border-color: var(--primary);
      background: rgba(124,58,237,0.2);
      box-shadow: 0 0 12px rgba(124,58,237,0.4);
    }

    /* Color picker */
    .color-picker {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .color-option {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .color-option:hover { transform: scale(1.2); }
    .color-option.selected {
      border-color: white;
      box-shadow: 0 0 0 2px var(--primary);
      transform: scale(1.2);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.1);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn:hover::before { opacity: 1; }
    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      box-shadow: 0 8px 24px rgba(124,58,237,0.4);
      margin-top: 8px;
    }
    .btn-primary:hover { box-shadow: 0 12px 30px rgba(124,58,237,0.6); transform: translateY(-1px); }

    .btn-secondary {
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      color: white;
      box-shadow: 0 8px 24px rgba(14,165,233,0.4);
      margin-top: 8px;
    }

    /* Room code display */
    .room-code-display {
      text-align: center;
      background: rgba(255,255,255,0.03);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .room-code-display p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; }
    .room-code {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 8px;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Features showcase */
    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 48px;
      width: 100%;
      max-width: 480px;
    }
    .feature-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: all 0.2s;
    }
    .feature-card:hover {
      background: rgba(255,255,255,0.06);
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.2);
    }
    .feature-icon { font-size: 1.8rem; margin-bottom: 8px; }
    .feature-card h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
    .feature-card p { font-size: 0.75rem; color: var(--text-muted); }

    /* Error message */
    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 12px;
      color: #fca5a5;
      font-size: 0.9rem;
      margin-top: 12px;
      display: none;
    }
    .error-msg.show { display: block; }

    /* Loading */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .loading-overlay.show { opacity: 1; pointer-events: all; }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span { color: var(--text-muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="particles" id="particles"></div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <div class="container">
    <div class="logo">
      <span class="logo-icon">🏠</span>
      <h1>SanalOda</h1>
      <p>Arkadaşlarınla her an, her yerde buluş ✨</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" id="tabCreate" onclick="switchTab('create')">Oda Oluştur</button>
        <button class="tab-btn" id="tabJoin" onclick="switchTab('join')">Odaya Katıl</button>
      </div>

      <!-- Oda Oluştur -->
      <div class="tab-content active" id="createTab">
        <div class="form-group">
          <label>Adın</label>
          <input type="text" id="createName" placeholder="Adını gir..." maxlength="20" />
        </div>

        <div class="form-group">
          <label>Oda Adı</label>
          <input type="text" id="roomName" placeholder="Örn: Cuma Buluşması 🍕" maxlength="30" />
        </div>

        <div class="form-group">
          <label>Avatarını Seç</label>
          <div class="avatar-picker" id="createAvatarPicker">
            <!-- JS ile doldurulacak -->
          </div>
        </div>

        <div class="form-group">
          <label>Rengin</label>
          <div class="color-picker" id="createColorPicker">
            <!-- JS ile doldurulacak -->
          </div>
        </div>

        <button class="btn btn-primary" onclick="createRoom()">🚀 Oda Oluştur</button>
        <div class="error-msg" id="createError"></div>
      </div>

      <!-- Odaya Katıl -->
      <div class="tab-content" id="joinTab">
        <div class="form-group">
          <label>Adın</label>
          <input type="text" id="joinName" placeholder="Adını gir..." maxlength="20" />
        </div>

        <div class="form-group">
          <label>Oda Kodu</label>
          <input type="text" id="roomCode" placeholder="6 haneli kodu gir..." maxlength="6"
            style="text-transform:uppercase; letter-spacing: 4px; font-size: 1.2rem; font-weight: 700;" />
        </div>

        <div class="form-group">
          <label>Avatarını Seç</label>
          <div class="avatar-picker" id="joinAvatarPicker">
            <!-- JS ile doldurulacak -->
          </div>
        </div>

        <div class="form-group">
          <label>Rengin</label>
          <div class="color-picker" id="joinColorPicker">
            <!-- JS ile doldurulacak -->
          </div>
        </div>

        <button class="btn btn-secondary" onclick="joinRoom()">🔑 Odaya Katıl</button>
        <div class="error-msg" id="joinError"></div>
      </div>
    </div>

    <div class="features">
      <div class="feature-card">
        <div class="feature-icon">💬</div>
        <h3>Anlık Sohbet</h3>
        <p>Gerçek zamanlı mesajlaş</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🍕</div>
        <h3>Yemek Siparişi</h3>
        <p>Birlikte sipariş ver</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🎵</div>
        <h3>Ortak Müzik</h3>
        <p>Aynı ritmi paylaş</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🎲</div>
        <h3>Mini Oyunlar</h3>
        <p>Zar at, anket aç</p>
      </div>
    </div>
  </div>

  <script>
    const AVATARS = ['😊','😎','🤩','🥳','😄','🤗','😏','🥸','🤓','😇','🦊','🐱','🐶','🐼','🦁','🐸','🦋','🌟'];
    const COLORS = ['#7c3aed','#ec4899','#f59e0b','#10b981','#0ea5e9','#ef4444','#8b5cf6','#f97316'];

    let selectedCreateAvatar = AVATARS[0];
    let selectedCreateColor = COLORS[0];
    let selectedJoinAvatar = AVATARS[1];
    let selectedJoinColor = COLORS[1];

    function buildAvatarPicker(containerId, selected, onSelect) {
      const container = document.getElementById(containerId);
      AVATARS.forEach(av => {
        const el = document.createElement('button');
        el.className = 'avatar-option' + (av === selected ? ' selected' : '');
        el.textContent = av;
        el.onclick = () => {
          container.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
          el.classList.add('selected');
          onSelect(av);
        };
        container.appendChild(el);
      });
    }

    function buildColorPicker(containerId, selected, onSelect) {
      const container = document.getElementById(containerId);
      COLORS.forEach(c => {
        const el = document.createElement('button');
        el.className = 'color-option' + (c === selected ? ' selected' : '');
        el.style.background = c;
        el.onclick = () => {
          container.querySelectorAll('.color-option').forEach(e => e.classList.remove('selected'));
          el.classList.add('selected');
          onSelect(c);
        };
        container.appendChild(el);
      });
    }

    buildAvatarPicker('createAvatarPicker', selectedCreateAvatar, (av) => selectedCreateAvatar = av);
    buildColorPicker('createColorPicker', selectedCreateColor, (c) => selectedCreateColor = c);
    buildAvatarPicker('joinAvatarPicker', selectedJoinAvatar, (av) => selectedJoinAvatar = av);
    buildColorPicker('joinColorPicker', selectedJoinColor, (c) => selectedJoinColor = c);

    // Particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 10 + 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
      particlesContainer.appendChild(p);
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById('tab' + (tab === 'create' ? 'Create' : 'Join')).classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
    }

    function showLoading() { document.getElementById('loadingOverlay').classList.add('show'); }

    function createRoom() {
      const name = document.getElementById('createName').value.trim();
      const roomName = document.getElementById('roomName').value.trim() || 'Arkadaş Odası';
      const errEl = document.getElementById('createError');

      if (!name) {
        errEl.textContent = '⚠️ Lütfen adını gir!';
        errEl.classList.add('show');
        return;
      }
      errEl.classList.remove('show');
      showLoading();

      const params = new URLSearchParams({
        name, avatar: selectedCreateAvatar, color: selectedCreateColor, roomName, action: 'create'
      });
      window.location.href = `room.html?${params}`;
    }

    function joinRoom() {
      const name = document.getElementById('joinName').value.trim();
      const code = document.getElementById('roomCode').value.trim().toUpperCase();
      const errEl = document.getElementById('joinError');

      if (!name) {
        errEl.textContent = '⚠️ Lütfen adını gir!';
        errEl.classList.add('show');
        return;
      }
      if (!code || code.length !== 6) {
        errEl.textContent = '⚠️ Geçerli bir oda kodu gir!';
        errEl.classList.add('show');
        return;
      }
      errEl.classList.remove('show');
      showLoading();

      const params = new URLSearchParams({
        name, avatar: selectedJoinAvatar, color: selectedJoinColor, roomId: code, action: 'join'
      });
      window.location.href = `room.html?${params}`;
    }

    // Enter tuşu desteği
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const activeTab = document.querySelector('.tab-content.active').id;
        if (activeTab === 'createTab') createRoom();
        else joinRoom();
      }
    });

    // URL'de roomId varsa otomatik join sekmesine geç
    const urlP = new URLSearchParams(window.location.search);
    if (urlP.get('join')) {
      switchTab('join');
      document.getElementById('roomCode').value = urlP.get('join');
    }
  </script>
</body>
</html>
